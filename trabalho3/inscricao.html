<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
</head>

<body>
    <h1>Formulário de incrição para Tech Challenge</h1>
    <form>
        <fieldset>
            <legend>Dados pessoais:</legend>

            <label for="fname">Nome completo:</label><br>
            <input type="text" id="fname" name="fname" value=""><br>
            <label for="nascimento">Data de nascimento:</label><br>
            <input type="date" id="nascimento" name="Data de nascimento"><br>
            <label for="cpf">CPF</label><br>
            <input type="number" id="cpf" value="" placeholder="000.000.000-00" maxlength="11"><br>
            <label for="email">E-mail:</label><br>
            <input type="text" id="email" name="E-mail"><br>
            <label for="telefone">Telefone:</label><br>
            <input type="number" id="telefone" value="" placeholder="(00)00000-0000" maxlength="11"><br>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" value=""><br>

        </fieldset>
    </form>
    <form>
        <fieldset>
            <legend>Endereço</legend>
            <label for="cep">CEP</label><br>
            <input type="number" id="cpf" value="" placeholder="00000-00" maxlength="8"><br>
            <label for="rua">Rua:</label><br>
            <input type="text" id="rua" name="rua" value=""><br>
            <label for="numero">Número:</label><br>
            <input type="number" id="numero" value=""><br>
            <label for="complemento">Complemento:</label><br>
            <input type="text" id="complemento" name="Complemento"><br>
            <label for="bairro">Bairro:</label><br>
            <input type="text" id="bairro" name="Bairro"><br>
            <label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="Cidade"><br>
            <label for="estado">Estado:</label><br>
            <input type="text" id="estado" name="Estado"><br>
        </fieldset>

    </form>
    <form>
        <fieldset>
            <legend>Situação do participante</legend>
             <input type="radio" id="estudante" name="situacao" value="estudante">
            <label for="estudante">Estudante</label>
           <input type="radio" id="professor" name="situacao" value="professor">
            <label for="professor">Professor</label>
            <input type="radio" id="profdaarea" name="situacao" value="profdaarea">
            <label for="profdaarea">Profissional da área</label>
          <input type="radio" id="outro" name="outro" value="outro">
            <label for="outro">Outro</label>

        </fieldset>


    </form>


</body>
