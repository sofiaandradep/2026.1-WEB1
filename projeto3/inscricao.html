<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
</head>

<body>
    <h1>Formulário de incrição para Tech Challenge</h1>
    <form>
        <fieldset>
            <legend>Dados pessoais:</legend>

            <label for="fname">Nome completo:</label><br>
            <input type="text" id="fname" name="fname" value=""><br>
            <label for="nascimento">Data de nascimento:</label><br>
            <input type="date" id="nascimento" name="nascimento"><br>
            <label for="cpf">CPF</label><br>
            <input type="text" id="cpf" name="cpf" value="" placeholder="000.000.000-00" maxlength="11"><br>
            <label for="email">E-mail:</label><br>
            <input type="text" id="email" name="E-mail"><br>
            <label for="telefone">Telefone:</label><br>
            <input type="text" id="telefone" name="telefone" placeholder="(00)00000-0000" maxlength="11"><br>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" value=""><br>

        </fieldset>
    </form>
    <form>
        <fieldset>
            <legend>Endereço</legend>
            <label for="cep">CEP</label><br>
            <input type="text" id="cep" name="cep" value="" placeholder="00000-00" maxlength="8"><br>
            <label for="rua">Rua:</label><br>
            <input type="text" id="rua" name="rua" value=""><br>
            <label for="numero">Número:</label><br>
            <input type="number" id="numero" name="numero" value=""><br>
            <label for="complemento">Complemento:</label><br>
            <input type="text" id="complemento" name="complemento"><br>
            <label for="bairro">Bairro:</label><br>
            <input type="text" id="bairro" name="Bairro"><br>
            <label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="Cidade"><br>
            <label for="estado">Estado:</label><br>
            <input type="text" id="estado" name="Estado"><br>
        </fieldset>

    </form>
    <form>
        <fieldset>
            <legend>Situação do participante</legend>
            <input type="radio" id="estudante" name="situacao" value="estudante">
            <label for="estudante">Estudante</label>
            <input type="radio" id="professor" name="situacao" value="professor">
            <label for="professor">Professor</label>
            <input type="radio" id="profdaarea" name="situacao" value="profdaarea">
            <label for="profdaarea">Profissional da área</label>
            <input type="radio" id="outro" name="situacao" value="outro">
            <label for="outro">Outro</label>

        </fieldset>


    </form>
    <form>
        <fieldset>
            <legend>Áreas de interesse </legend>
            <input type="checkbox" id="ai1" name="ai1" value="inteligenciaartificial"><br>
            <label for="ai1">Inteligência Artifical</label><br>
            <input type="checkbox" id="ai2" name="ai2" value="desenweb"><br>
            <label for="ai2">Desenvolvimento web</label><br <input type="checkbox" id="ai3" name="ai3"
                value="redes"><br>
            <label for="ai3">Redes</label><br>
            <input type="checkbox" id="ai4" name="ai4" value="seguranca"><br>
            <label for="ai4">Segurança</label><br>
            <input type="checkbox" id="ai5" name="ai5" value="bancodados"><br>
            <label for="ai5">Banco de Dados</label><br>
            <input type="checkbox" id="ai6" name="ai6" value="computacaografica"><br>
            <label for="ai6">Computação Gráfica</label><br>
            <input type="checkbox" id="ai7" name="ai7" value="programacao"><br>
            <label for="ai7">Programação</label>

        </fieldset>
    </form>

    <form>
        <fieldset>
            <legend>Escolha de palestra </legend>
            <input type="radio" id="dmam	" name="palestra" value="dmam">
            <label for="dmam">Do Monólito aos Microsserviços: Estratégias de Migração Sem Parar a Operação </label><br>
            <input type="radio" id="adss" name="palestra" value="adss">
            <label for="adss">Arquitetura de Software Sustentável</label><br>
            <input type="radio" id="dpcia" name="palestra" value="dpcia">
            <label for="dpcia">Desenvolvimento Prático com Inteligência Artificial e Agentes Autônomos</label><br>
            <input type="radio" id="aasp" name="palestra" value="aasp">
            <label for="aasp">DevSecOps na Prática: Automatizando a Segurança no Pipeline de CI/CD</label>

        </fieldset>


        <form>
            <fieldset>
                <legend>Experiência em programação</legend>
                <input type="radio" id="nenhuma" name="experiencia" value="nenhuma">
                <label for="nenhuma">Nenhuma experiência</label><br>
                <input type="radio" id="iniciante" name="experiencia" value="iniciante">
                <label for="iniciante">Iniciante</label>
                <input type="radio" id="intermediario" name="experiencia" value="intermediario">
                <label for="intermediario">Intermediário</label>
                <input type="radio" id="avancado" name="experiencia" value="avancado">
                <label for="avancado">Avançado</label>
            </fieldset>
            <form>
                <fieldset>
                    <legend>Tempo de experiência</legend>
                    <input type="radio" id="menos1" name="tempo" value="menos1">
                    <label for="menos1">Menos de 1 ano</label>
                    <input type="radio" id="1" name="tempo" value="1">
                    <label for="1">Cerca de 1 ano</label>
                    <input type="radio" id="2" name="tempo" value="2">
                    <label for="2">Cerca de 2 anos</label>
                    <input type="radio" id="3-5" name="tempo" value="3-5">
                    <label for="3">Cerca de 3 a 5 anos </label>
                    <input type="radio" id="6-10" name="tempo" value="6-10">
                    <label for="6-10">Cerca de 6 a 10 anos</label>
                    <input type="radio" id="10" name="tempo" value="10">
                    <label for="6-10">Acima de 10 anos</label>
                </fieldset>
            </form>

            <form>
                <fieldset>
                    <legend>Sistema Operacional utilizado</legend>
                    <input type="radio" id="linux" name="so" value="linux">
                    <label for="linux">Linux</label>
                    <input type="radio" id="windows" name="so" value="windows">
                    <label for="windows">Windows</label>
                    <input type="radio" id="macos" name="so" value="macos">
                    <label for="macos">MacOSx</label>
                    <input type="radio" id="lubuntu" name="so" value="lubuntu">
                    <label for="lubuntu">Lubuntux</label>

                </fieldset>
            </form>
            <form>
                <form>
                    <fieldset>
                        <legend>Como você conheceu o Tech Challenge? </legend>
                        <input type="radio" id="rs" name="conheceu" value="rs">
                        <label for="rs">Redes sociais</label><br>
                        <input type="radio" id="anuncio" name="conheceu" value="anuncio">
                        <label for="anuncio">Anúncio</label><br>
                        <input type="radio" id="amigo" name="conheceu" value="amigo">
                        <label for="dpcia">Por um amigo</label><br>
                        <input type="radio" id="outro" name="conheceu" value="outro">
                        <label for="outro">Outro</label>

                    </fieldset>
                    <form>
                        <fieldset>
                           <label for="pergunta">Por que você deseja participar do Tech Challenge?</label>
                            <textarea id="pergunta" name="pergunta" rows="4"cols="50">Digite seu texto aqui</textarea>
                            
                        </fieldset>
                    </form>
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                    <a href="index.html">
                        <button type="button"> ← Voltar para o Início
                        </button>
                    </a>

</body>
